[preset.0]
name="Windows x64"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="Assets/**/*.json,Assets/**/*.txt"
exclude_filter="tools/*,README.md,*.command,*.csproj,NuGet.Config,global.json"
export_path="builds/windows/NoDwarf.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=1
codesign/enable=false
application/product_name="NoDwarf"
application/file_description="NoDwarf"
dotnet/include_scripts_content=false
dotnet/embed_build_outputs=false

[preset.1]
name="macOS Apple Silicon"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="Assets/**/*.json,Assets/**/*.txt"
exclude_filter="tools/*,README.md,*.command,*.csproj,NuGet.Config,global.json"
export_path="builds/macos/NoDwarf.app"

[preset.1.options]
binary_format/architecture="arm64"
application/bundle_identifier="io.github.ez4chen.nodwarf"
application/short_version="0.1.0"
application/version="0.1.0"
codesign/codesign=1
codesign/entitlements/allow_jit_code_execution=true
codesign/entitlements/allow_unsigned_executable_memory=true
codesign/entitlements/allow_dyld_environment_variables=true
notarization/notarization=0
dotnet/include_scripts_content=false
dotnet/embed_build_outputs=false
